name = "hgd-edu-admin"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
WX_APPID = "wxcde7f3fd1d5fc715"
CLOUD_ENV = "cloud1-d6gio7v8iff39bab7"

# 密钥不要写在这里，部署时用：
#   npx wrangler secret put WX_APP_SECRET      （微信小程序 AppSecret）
#   npx wrangler secret put ADMIN_API_SECRET   （服务端调用共享密钥，必须与云函数 adminApi
#                                               环境变量 ADMIN_API_SECRET、admin-server
#                                               config.json 的 adminApiSecret 三处一致，
#                                               否则登录/数据接口全部失败）
# 执行 deploy.ps1 或见 DEPLOY.md

[[kv_namespaces]]
binding = "ADMIN_KV"
# 部署前执行: npx wrangler kv namespace create ADMIN_KV ，把返回的 id 填在下一行
id = "e1b15a9f9e4d437baa0f287f6a63da27"
